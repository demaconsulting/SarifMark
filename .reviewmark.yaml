---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "**/*.cs"
  - "!**/obj/**"

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/SarifMark/reviews/index.json

# Review sets grouping files by logical unit of review.
reviews:
  - id: SarifMark-CLI-Review
    title: Review of SarifMark Command Line and Integration Tests
    paths:
      - "docs/reqstream/command-line.yaml"
      - "docs/reqstream/platform.yaml"
      - "docs/reqstream/ots-software.yaml"
      - "docs/design/command-line.md"
      - "src/**/Program.cs"
      - "src/**/Context.cs"
      - "test/**/ProgramTests.cs"
      - "test/**/ContextTests.cs"
      - "test/**/IntegrationTests.cs"
      - "test/**/Runner.cs"
      - "test/**/AssemblyInfo.cs"

  - id: SarifMark-SARIF-Review
    title: Review of SarifMark SARIF and Reporting
    paths:
      - "docs/reqstream/sarif.yaml"
      - "docs/reqstream/report.yaml"
      - "docs/design/sarif.md"
      - "src/**/SarifResult.cs"
      - "src/**/SarifResults.cs"
      - "test/**/SarifResultsTests.cs"

  - id: SarifMark-Validation-Review
    title: Review of SarifMark Self-Validation
    paths:
      - "docs/reqstream/validation.yaml"
      - "docs/design/validation.md"
      - "src/**/Validation.cs"
      - "test/**/ValidationTests.cs"

  - id: SarifMark-Utilities-Review
    title: Review of SarifMark Utilities
    paths:
      - "docs/design/utilities.md"
      - "src/**/PathHelpers.cs"
      - "test/**/PathHelpersTests.cs"
