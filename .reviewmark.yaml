---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following software unit boundaries.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "**/*.cs"                          # All C# source and test files
  - "requirements.yaml"                # Root requirements file
  - "docs/reqstream/**/*.yaml"         # Requirements files
  - "docs/design/**/*.md"              # Design documents
  - "README.md"                        # Root level README
  - "docs/user_guide/**/*.md"          # User guide
  - "!**/obj/**"                       # Exclude build output
  - "!**/bin/**"                       # Exclude build output

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/SarifMark/reviews/index.json

# Review sets grouping files by logical unit of review.
# Purpose review: proves advertised features match the system design.
# Architecture reviews: prove the system satisfies its requirements.
# Design review: proves design is consistent and complete.
# AllRequirements review: proves requirements are consistent and complete.
# Subsystem reviews: prove each subsystem satisfies its requirements.
# Unit reviews: prove each unit is designed, implemented, and tested correctly.
reviews:

  # ---------------------------------------------------------------------------
  # Purpose Review
  # ---------------------------------------------------------------------------

  - id: SarifMark-Purpose
    title: Review that Advertised Features Match System Design
    paths:
      - "README.md"
      - "docs/user_guide/**/*.md"
      - "docs/reqstream/sarifmark/sarifmark.yaml"
      - "docs/design/introduction.md"
      - "docs/design/sarifmark/sarifmark.md"

  # ---------------------------------------------------------------------------
  # Architecture Review
  # ---------------------------------------------------------------------------

  - id: SarifMark-Architecture
    title: Review that SarifMark Architecture Satisfies Requirements
    paths:
      - "docs/reqstream/sarifmark/sarifmark.yaml"
      - "docs/design/introduction.md"
      - "docs/design/sarifmark/sarifmark.md"
      - "test/**/IntegrationTests.cs"
      - "test/**/Runner.cs"
      - "test/**/AssemblyInfo.cs"

  # ---------------------------------------------------------------------------
  # Design Review
  # ---------------------------------------------------------------------------

  - id: SarifMark-Design
    title: Review that SarifMark Design is Consistent and Complete
    paths:
      - "docs/reqstream/sarifmark/sarifmark.yaml"
      - "docs/reqstream/sarifmark/platform-requirements.yaml"
      - "docs/design/introduction.md"
      - "docs/design/sarifmark/**/*.md"

  # ---------------------------------------------------------------------------
  # All Requirements Review
  # ---------------------------------------------------------------------------

  - id: SarifMark-AllRequirements
    title: Review that All SarifMark Requirements are Complete
    paths:
      - "requirements.yaml"
      - "docs/reqstream/sarifmark/**/*.yaml"
      - "docs/reqstream/ots/**/*.yaml"

  # ---------------------------------------------------------------------------
  # Subsystem Reviews
  # ---------------------------------------------------------------------------

  - id: SarifMark-Cli
    title: Review that SarifMark Cli Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/sarifmark/cli/cli.yaml"
      - "docs/design/sarifmark/cli/cli.md"
      - "test/**/Cli/CliTests.cs"

  - id: SarifMark-Sarif
    title: Review that SarifMark Sarif Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/sarifmark/sarif/sarif.yaml"
      - "docs/reqstream/sarifmark/sarif/report.yaml"
      - "docs/design/sarifmark/sarif/sarif.md"
      - "test/**/Sarif/SarifTests.cs"

  - id: SarifMark-SelfTest
    title: Review that SarifMark SelfTest Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/sarifmark/self-test/self-test.yaml"
      - "docs/design/sarifmark/self-test/self-test.md"
      - "test/**/SelfTest/SelfTestTests.cs"

  - id: SarifMark-Utilities
    title: Review that SarifMark Utilities Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/sarifmark/utilities/utilities.yaml"
      - "docs/design/sarifmark/utilities/utilities.md"
      - "test/**/Utilities/UtilitiesTests.cs"

  # ---------------------------------------------------------------------------
  # Software Unit Reviews
  # ---------------------------------------------------------------------------

  - id: SarifMark-Program
    title: Review that SarifMark Program Implementation is Correct
    paths:
      - "docs/reqstream/sarifmark/program.yaml"
      - "docs/design/sarifmark/program.md"
      - "src/**/Program.cs"
      - "test/**/ProgramTests.cs"

  - id: SarifMark-Cli-Context
    title: Review that SarifMark Cli Context Implementation is Correct
    paths:
      - "docs/reqstream/sarifmark/cli/context.yaml"
      - "docs/design/sarifmark/cli/context.md"
      - "src/**/Cli/Context.cs"
      - "test/**/Cli/ContextTests.cs"

  - id: SarifMark-Sarif-SarifFinding
    title: Review that SarifMark Sarif SarifFinding Implementation is Correct
    paths:
      - "docs/reqstream/sarifmark/sarif/sarif-finding.yaml"
      - "docs/design/sarifmark/sarif/sarif-finding.md"
      - "src/**/Sarif/SarifFinding.cs"
      - "test/**/Sarif/SarifFindingTests.cs"

  - id: SarifMark-Sarif-SarifResults
    title: Review that SarifMark Sarif SarifResults Implementation is Correct
    paths:
      - "docs/reqstream/sarifmark/sarif/sarif-results.yaml"
      - "docs/design/sarifmark/sarif/sarif-results.md"
      - "src/**/Sarif/SarifResults.cs"
      - "test/**/Sarif/SarifResultsTests.cs"

  - id: SarifMark-Sarif-SarifRun
    title: Review that SarifMark Sarif SarifRun Implementation is Correct
    paths:
      - "docs/reqstream/sarifmark/sarif/sarif-run.yaml"
      - "docs/design/sarifmark/sarif/sarif-run.md"
      - "src/**/Sarif/SarifRun.cs"
      - "test/**/Sarif/SarifRunTests.cs"

  - id: SarifMark-SelfTest-Validation
    title: Review that SarifMark SelfTest Validation Implementation is Correct
    paths:
      - "docs/reqstream/sarifmark/self-test/validation.yaml"
      - "docs/design/sarifmark/self-test/validation.md"
      - "src/**/SelfTest/Validation.cs"
      - "test/**/SelfTest/ValidationTests.cs"

  - id: SarifMark-Utilities-PathHelpers
    title: Review that SarifMark Utilities PathHelpers Implementation is Correct
    paths:
      - "docs/reqstream/sarifmark/utilities/path-helpers.yaml"
      - "docs/design/sarifmark/utilities/path-helpers.md"
      - "src/**/Utilities/PathHelpers.cs"
      - "test/**/Utilities/PathHelpersTests.cs"
