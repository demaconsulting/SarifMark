---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - README.md
  - requirements.yaml
  - '**/*.cs'
  - docs/reqstream/**/*.yaml
  - docs/design/**/*.md
  - docs/verification/**/*.md
  - docs/user_guide/**/*.md
  - docs/sysml2/**/*.sysml
  - '!**/obj/**'
  - '!**/bin/**'
  - '!**/generated/**'

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/SarifMark/reviews/index.json

# Global context shown to every reviewer for orientation but not fingerprinted.
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:

  # Purpose
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    paths:
      - README.md
      - docs/user_guide/**/*.md

  # Decomposition
  - id: Decomposition
    title: Review that SarifMark Decomposition Addresses the Stated Purpose
    context:
      - README.md
      - docs/user_guide/**/*.md
    paths:
      - requirements.yaml
      - docs/design/introduction.md
      - docs/sysml2/**/*.sysml

  # SarifMark - Specials
  - id: SarifMark-Architecture
    title: Review that SarifMark Architecture Satisfies Requirements
    context:
      - README.md
      - docs/user_guide/**/*.md
    paths:
      - docs/reqstream/sarifmark.yaml
      - docs/design/introduction.md
      - docs/design/sarifmark.md
      - docs/design/ots.md
      - docs/design/shared.md
      - docs/verification/introduction.md
      - docs/verification/sarifmark.md
      - test/**/IntegrationTests.cs
      - test/**/Runner.cs
      - test/**/AssemblyInfo.cs

  - id: SarifMark-Design
    title: Review that SarifMark Design is Consistent and Complete
    context:
      - docs/reqstream/sarifmark.yaml
    paths:
      - docs/reqstream/sarifmark/platform-requirements.yaml
      - docs/design/introduction.md
      - docs/design/sarifmark.md
      - docs/design/sarifmark/**/*.md
      - docs/design/ots.md
      - docs/design/shared.md

  - id: SarifMark-Verification
    title: Review that SarifMark Verification is Consistent and Complete
    context:
      - docs/reqstream/sarifmark.yaml
    paths:
      - docs/verification/introduction.md
      - docs/verification/sarifmark.md
      - docs/verification/sarifmark/**/*.md
      - docs/verification/ots.md
      - docs/verification/shared.md

  - id: SarifMark-AllRequirements
    title: Review that All SarifMark Requirements are Complete
    context:
      - docs/design/sarifmark.md
      - docs/reqstream/sarifmark.yaml
    paths:
      - requirements.yaml
      - docs/reqstream/sarifmark.yaml
      - docs/reqstream/sarifmark/**/*.yaml
      - docs/reqstream/ots/**/*.yaml

  # SarifMark - Program
  - id: SarifMark-Program
    title: Review that SarifMark Program Implementation is Correct
    context:
      - docs/design/sarifmark.md
      - docs/reqstream/sarifmark.yaml
    paths:
      - docs/reqstream/sarifmark/program.yaml
      - docs/design/sarifmark/program.md
      - docs/verification/sarifmark/program.md
      - src/**/Program.cs
      - test/**/ProgramTests.cs

  # SarifMark - Cli
  - id: SarifMark-Cli
    title: Review that SarifMark Cli Satisfies Subsystem Requirements
    context:
      - docs/design/sarifmark.md
      - docs/reqstream/sarifmark.yaml
    paths:
      - docs/reqstream/sarifmark/cli.yaml
      - docs/design/sarifmark/cli.md
      - docs/verification/sarifmark/cli.md
      - test/**/Cli/CliTests.cs

  - id: SarifMark-Cli-Context
    title: Review that SarifMark Cli Context Implementation is Correct
    context:
      - docs/design/sarifmark.md
      - docs/reqstream/sarifmark.yaml
      - docs/design/sarifmark/cli.md
      - docs/reqstream/sarifmark/cli.yaml
    paths:
      - docs/reqstream/sarifmark/cli/context.yaml
      - docs/design/sarifmark/cli/context.md
      - docs/verification/sarifmark/cli/context.md
      - src/**/Cli/Context.cs
      - test/**/Cli/ContextTests.cs

  # SarifMark - Sarif
  - id: SarifMark-Sarif
    title: Review that SarifMark Sarif Satisfies Subsystem Requirements
    context:
      - docs/design/sarifmark.md
      - docs/reqstream/sarifmark.yaml
    paths:
      - docs/reqstream/sarifmark/sarif.yaml
      - docs/design/sarifmark/sarif.md
      - docs/verification/sarifmark/sarif.md
      - test/**/Sarif/SarifTests.cs

  - id: SarifMark-Sarif-SarifFinding
    title: Review that SarifMark Sarif SarifFinding Implementation is Correct
    context:
      - docs/design/sarifmark.md
      - docs/reqstream/sarifmark.yaml
      - docs/design/sarifmark/sarif.md
      - docs/reqstream/sarifmark/sarif.yaml
    paths:
