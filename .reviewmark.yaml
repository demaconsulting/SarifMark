---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "**/*.cs"
  - "!**/obj/**"

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/SarifMark/reviews/index.json

# Review sets grouping files by logical unit of review.
# Public concept reviews cover the externally-visible behaviour of each feature area.
# Class reviews cover the internal design and implementation of each individual class.
reviews:

  # ---------------------------------------------------------------------------
  # Public Concept Reviews
  # ---------------------------------------------------------------------------

  - id: SarifMark-CommandLine-Concept-Review
    title: Review of SarifMark Command-Line Interface Concept
    paths:
      - "docs/reqstream/command-line.yaml"
      - "docs/reqstream/program.yaml"
      - "docs/reqstream/context.yaml"
      - "docs/design/introduction.md"
      - "docs/design/command-line.md"
      - "src/**/Program.cs"
      - "src/**/Context.cs"
      - "test/**/ProgramTests.cs"
      - "test/**/ContextTests.cs"
      - "test/**/IntegrationTests.cs"
      - "test/**/Runner.cs"
      - "test/**/AssemblyInfo.cs"

  - id: SarifMark-Sarif-Concept-Review
    title: Review of SarifMark SARIF Reading Concept
    paths:
      - "docs/reqstream/sarif.yaml"
      - "docs/reqstream/sarif-result.yaml"
      - "docs/reqstream/sarif-results.yaml"
      - "docs/design/sarif.md"
      - "src/**/SarifResult.cs"
      - "src/**/SarifResults.cs"
      - "test/**/SarifResultsTests.cs"
      - "test/**/IntegrationTests.cs"

  - id: SarifMark-Report-Concept-Review
    title: Review of SarifMark Report Generation Concept
    paths:
      - "docs/reqstream/report.yaml"
      - "docs/reqstream/sarif-results.yaml"
      - "docs/design/sarif.md"
      - "src/**/SarifResults.cs"
      - "test/**/SarifResultsTests.cs"
      - "test/**/IntegrationTests.cs"

  - id: SarifMark-Validation-Concept-Review
    title: Review of SarifMark Self-Validation Concept
    paths:
      - "docs/reqstream/validation.yaml"
      - "docs/reqstream/validation-class.yaml"
      - "docs/design/validation.md"
      - "src/**/Validation.cs"
      - "test/**/ValidationTests.cs"
      - "test/**/IntegrationTests.cs"

  - id: SarifMark-Platform-Concept-Review
    title: Review of SarifMark Platform and OTS Software
    paths:
      - "docs/reqstream/platform.yaml"
      - "docs/reqstream/ots-software.yaml"

  # ---------------------------------------------------------------------------
  # Class Reviews
  # ---------------------------------------------------------------------------

  - id: SarifMark-Program-Class-Review
    title: Review of SarifMark Program Class
    paths:
      - "docs/reqstream/program.yaml"
      - "docs/design/program.md"
      - "src/**/Program.cs"
      - "test/**/ProgramTests.cs"
      - "test/**/IntegrationTests.cs"
      - "test/**/Runner.cs"
      - "test/**/AssemblyInfo.cs"

  - id: SarifMark-Context-Class-Review
    title: Review of SarifMark Context Class
    paths:
      - "docs/reqstream/context.yaml"
      - "docs/design/context.md"
      - "src/**/Context.cs"
      - "test/**/ContextTests.cs"

  - id: SarifMark-SarifResult-Class-Review
    title: Review of SarifMark SarifResult Record
    paths:
      - "docs/reqstream/sarif-result.yaml"
      - "docs/design/sarif-result.md"
      - "src/**/SarifResult.cs"
      - "test/**/SarifResultsTests.cs"

  - id: SarifMark-SarifResults-Class-Review
    title: Review of SarifMark SarifResults Record
    paths:
      - "docs/reqstream/sarif-results.yaml"
      - "docs/design/sarif-results.md"
      - "src/**/SarifResults.cs"
      - "test/**/SarifResultsTests.cs"

  - id: SarifMark-Validation-Class-Review
    title: Review of SarifMark Validation Class
    paths:
      - "docs/reqstream/validation-class.yaml"
      - "docs/design/validation.md"
      - "src/**/Validation.cs"
      - "test/**/ValidationTests.cs"

  - id: SarifMark-PathHelpers-Class-Review
    title: Review of SarifMark PathHelpers Class
    paths:
      - "docs/reqstream/path-helpers.yaml"
      - "docs/design/utilities.md"
      - "docs/design/path-helpers.md"
      - "src/**/PathHelpers.cs"
      - "test/**/PathHelpersTests.cs"
