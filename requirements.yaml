# Requirements Testing Strategy
#
# This project uses three categories of tests to verify requirements:
#
# 1. Unit Tests - Run locally via "dotnet test"
# 2. Self-Validation Tests - Run locally via "--validate"
# 3. Platform Tests - Run via CI/CD across OS/runtime matrix
#
# NOTE: Running "reqstream --enforce" with only local test results (unit tests
# and local self-validation) is expected to show some unsatisfied requirements.
# Platform-specific requirements require test results from CI/CD runs across
# the full OS and runtime matrix.
#
---
includes:
  - docs/reqstream/system.yaml
  - docs/reqstream/cli/subsystem-cli.yaml
  - docs/reqstream/cli/unit-context.yaml
  - docs/reqstream/sarif/subsystem-sarif.yaml
  - docs/reqstream/sarif/subsystem-report.yaml
  - docs/reqstream/sarif/unit-sarif-result.yaml
  - docs/reqstream/sarif/unit-sarif-results.yaml
  - docs/reqstream/self-test/subsystem-self-test.yaml
  - docs/reqstream/self-test/unit-validation.yaml
  - docs/reqstream/utilities/subsystem-utilities.yaml
  - docs/reqstream/utilities/unit-path-helpers.yaml
  - docs/reqstream/platform-requirements.yaml
  - docs/reqstream/ots/ots-software.yaml
  - docs/reqstream/unit-program.yaml
