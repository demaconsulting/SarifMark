---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Project-specific technical terms and tool names
words:
  - Blockquotes
  - BuildMark
  - buildtransitive
  - Checkmarx
  - contentfiles
  - dcterms
  - DEMA
  - doctitle
  - docversion
  - FileAssert
  - LASTEXITCODE
  - mstest
  - pagetitle
  - pandoc
  - Pylint
  - ReqStream
  - ReviewMark
  - SARIF
  - SarifMark
  - Semgrep
  - slnx
  - snupkg
  - SonarMark
  - SonarQube
  - thirdparty
  - venv
  - VersionMark
  - WeasyPrint
  - Werror
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
