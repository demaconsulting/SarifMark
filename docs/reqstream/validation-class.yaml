---
sections:
  - title: Internal Functionality
    sections:
      - title: Validation Class
        requirements:
          - id: SarifMark-Vld-Run
            title: The Run method shall orchestrate validation by executing the header, all tests, the summary, and the results file in sequence.
            justification: >-
              Sequencing these four phases in a fixed order ensures that every validation run produces a
              consistent, complete report regardless of individual test outcomes, giving users a reliable
              picture of the tool's health in their environment.
            tags: [internal]
            tests:
              - Validation_Run_ValidContext_RunsAllTests

          - id: SarifMark-Vld-NullCheck
            title: The Run method shall reject a null context by throwing ArgumentNullException.
            justification: >-
              Explicitly rejecting null at the method boundary produces a clear and immediate diagnostic
              rather than a cryptic NullReferenceException deep in the call stack, making integration
              errors easier to diagnose and fix.
            tags: [internal]
            tests:
              - Validation_Run_NullContext_ThrowsArgumentNullException

          - id: SarifMark-Vld-Header
            title: The PrintValidationHeader method shall emit a system information table before the tests run.
            justification: >-
              Printing platform and runtime details before any tests execute ensures that validation
              results can always be contextualised with the environment in which they were collected,
              aiding reproducibility and cross-environment comparison.
            tags: [internal]
            tests:
              - Validation_Run_ValidContext_PrintsValidationHeader

          - id: SarifMark-Vld-SarifReadingTest
            title: The RunSarifReadingTest method shall verify end-to-end SARIF reading within the self-validation suite.
            justification: >-
              Including a SARIF reading test in self-validation confirms that the installed tool can parse
              real SARIF data in the target environment, catching issues that may not surface in unit tests
              run during development.
            tags: [internal]
            tests:
              - Validation_Run_ValidContext_RunsAllTests

          - id: SarifMark-Vld-ReportGenerationTest
            title: The RunMarkdownReportGenerationTest method shall verify end-to-end markdown report generation within the self-validation suite.
            justification: >-
              Validating report generation as a self-contained test confirms that the full pipeline from
              SARIF input to markdown output operates correctly in the deployment environment, providing
              confidence beyond what unit tests alone can offer.
            tags: [internal]
            tests:
              - Validation_Run_ValidContext_RunsAllTests

          - id: SarifMark-Vld-EnforcementTest
            title: The RunEnforcementTest method shall verify enforcement mode behaviour within the self-validation suite.
            justification: >-
              Testing enforcement mode during self-validation ensures that the quality gate capability
              functions correctly in the installed environment, confirming that the tool will correctly
              fail builds when issues are detected.
            tags: [internal]
            tests:
              - Validation_Run_ValidContext_RunsAllTests

          - id: SarifMark-Vld-Summary
            title: The Run method shall print a pass/fail summary after all tests have executed.
            justification: >-
              A printed summary provides an at-a-glance verdict of the overall validation result without
              requiring the caller to parse individual test lines, making the output useful in both
              interactive and automated execution contexts.
            tags: [internal]
            tests:
              - Validation_Run_ValidContext_PrintsSummary

          - id: SarifMark-Vld-ResultsFile
            title: The WriteResultsFile method shall write a TRX file for .trx extensions, a JUnit XML file for .xml extensions, and report an error for other extensions.
            justification: >-
              Supporting both TRX and JUnit formats maximises CI/CD platform compatibility, and reporting
              an error for unrecognised extensions prevents silent data loss when callers specify an
              unsupported output format.
            tags: [internal]
            tests:
              - Validation_Run_WithTrxResultsFile_WritesResultsFile
              - Validation_Run_WithXmlResultsFile_WritesResultsFile
              - Validation_Run_WithUnsupportedResultsFileExtension_WritesError

          - id: SarifMark-Vld-TempDir
            title: The TemporaryDirectory helper shall create a temporary directory on construction and delete it on disposal.
            justification: >-
              Creating and cleaning up temporary directories through a disposable helper ensures that
              test isolation is maintained and that test artefacts do not accumulate on disk across
              repeated validation runs.
            tags: [internal]
            tests:
              - Validation_Run_ValidContext_RunsAllTests
