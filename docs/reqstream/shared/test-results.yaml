---
# TestResults shared package requirements

sections:
  - title: Shared Package Requirements
    sections:
      - title: TestResults Requirements
        requirements:
          - id: SarifMark-Shared-TestResults-Collection
            title: TestResults shall provide a named test result collection that aggregates
              individual test outcomes.
            justification: |
              SarifMark's self-validation creates a TestResults collection named
              "SarifMark Self-Validation" to accumulate pass/fail outcomes for all
              self-validation scenarios. The collection must expose a count of results
              and support iteration so that totals can be calculated and reported.
            tags: [shared]
            tests:
              - Validation_Run_ValidContext_PrintsSummary

          - id: SarifMark-Shared-TestResults-AddResult
            title: TestResults shall allow individual test results with pass/fail
              outcomes, error messages, and durations to be added to the collection.
            justification: |
              Each self-validation scenario produces a TestResult entry carrying a name,
              class name, code base, outcome (Passed or Failed), an optional error message,
              and a wall-clock duration. All three scenarios must be recorded before the
              summary is printed.
            tags: [shared]
            tests:
              - Validation_Run_ValidContext_RunsAllTests
              - Validation_Run_ValidContext_VerifiesSarifReadingOutput
              - Validation_Run_ValidContext_VerifiesReportGenerationOutput
              - Validation_Run_ValidContext_VerifiesEnforcementOutput

          - id: SarifMark-Shared-TestResults-TrxSerialization
            title: TestResults shall serialize the result collection to TRX format.
            justification: |
              When the --results option specifies a .trx file path, SarifMark serializes
              the TestResults collection to TRX XML so that the file can be consumed by
              Visual Studio Test Explorer and CI pipeline tooling.
            tags: [shared]
            tests:
              - Validation_Run_WithTrxResultsFile_WritesResultsFile

          - id: SarifMark-Shared-TestResults-JUnitSerialization
            title: TestResults shall serialize the result collection to JUnit XML
              format.
            justification: |
              When the --results option specifies a .xml file path, SarifMark serializes
              the TestResults collection to JUnit XML so that the file can be consumed by
              CI pipeline tooling that expects JUnit-format reports.
            tags: [shared]
            tests:
              - Validation_Run_WithXmlResultsFile_WritesResultsFile
