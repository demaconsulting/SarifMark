---
# SarifMark platform requirements
#
# Source filter prefixes used in this file restrict which test results count as
# evidence for platform and runtime requirements.
#
# Source filter prefixes:
#   windows@TestName    - proves the test passed on a Windows platform
#   ubuntu@TestName     - proves the test passed on a Linux (Ubuntu) platform
#   macos@TestName      - proves the test passed on a macOS platform
#   net10.0@TestName    - proves the test passed under the .NET 10 target framework
#   net11.0@TestName    - proves the test passed under the .NET 11 target framework
#   dotnet10.x@TestName - proves the self-validation test ran with .NET 10.x runtime
#   dotnet11.x@TestName - proves the self-validation test ran with .NET 11.x runtime
#
# Removing these filters invalidates the evidence-based proof for the requirements.
sections:
  - title: SarifMark Requirements
    sections:
      - title: Platform Support
        requirements:
          - id: SarifMark-Plt-Windows
            title: The tool shall run on Windows operating systems.
            justification: >-
              Windows support ensures the tool is accessible to developers using Microsoft
              platforms, which are
              prevalent in enterprise environments and .NET development ecosystems.
            tags: [public]
            tests:
              - windows@SarifMark_VersionFlag_OutputsVersion
              - windows@SarifMark_HelpFlag_OutputsUsageInformation
              - windows@SarifMark_ValidateFlag_RunsSelfValidation

          - id: SarifMark-Plt-Linux
            title: The tool shall run on Linux operating systems.
            justification: >-
              Linux support is essential for cloud-native development and CI/CD pipelines,
              as most modern build
              systems and container environments run on Linux.
            tags: [public]
            tests:
              - ubuntu@SarifMark_VersionFlag_OutputsVersion
              - ubuntu@SarifMark_HelpFlag_OutputsUsageInformation
              - ubuntu@SarifMark_ValidateFlag_RunsSelfValidation

          - id: SarifMark-Plt-MacOS
            title: The tool shall run on macOS operating systems.
            justification: >-
              macOS support ensures the tool is accessible to developers using Apple
              platforms, which are widely
              used in software development environments.
            tags: [public]
            tests:
              - macos@SarifMark_VersionFlag_OutputsVersion
              - macos@SarifMark_HelpFlag_OutputsUsageInformation
              - macos@SarifMark_ValidateFlag_RunsSelfValidation

          - id: SarifMark-Plt-Net10
            title: The tool shall support .NET 10.0 runtime.
            justification: >-
              .NET 10.0 is a Long-Term Support (LTS) release and the oldest supported .NET
              runtime. Supporting this version ensures the tool remains usable for organizations
              following Microsoft's LTS support lifecycle and requiring stability guarantees.
            tags: [public]
            tests:
              - dotnet10.x@SarifMark_SarifReading
              - dotnet10.x@SarifMark_MarkdownReportGeneration
              - dotnet10.x@SarifMark_Enforcement

          - id: SarifMark-Plt-Net11
            title: The tool shall support .NET 11.0 runtime.
            justification: >-
              .NET 11.0 is the latest .NET release. Supporting this version provides users access
              to the latest .NET features and performance improvements for teams who adopt newer
              releases.
            tags: [public]
            tests:
              - dotnet11.x@SarifMark_SarifReading
              - dotnet11.x@SarifMark_MarkdownReportGeneration
              - dotnet11.x@SarifMark_Enforcement
