---
# Sarif subsystem requirements

sections:
  - title: 'SarifMark Requirements'
    sections:
      - title: Sarif Requirements
        requirements:
          - id: SarifMark-Sarif-Reading
            title: The tool shall read SARIF 2.1.0 format files.
            justification: >-
              Support for SARIF 2.1.0 is essential as it is the standard format for
              static analysis results,
              enabling interoperability with a wide range of analysis tools and platforms.
            tags: [public]
            children:
              - SarifMark-SarifResults-ParseResults
            tests:
              - Sarif_Read_ValidSarifFile_ProcessesSuccessfully

          - id: SarifMark-Sarif-Validation
            title: The tool shall validate SARIF file format.
            justification: >-
              Format validation ensures the tool processes only well-formed SARIF
              files, preventing runtime
              errors and providing clear feedback when inputs are malformed or corrupted.
            tags: [public]
            children:
              - SarifMark-SarifResults-ValidatePathArgument
              - SarifMark-SarifResults-ValidatePathExists
              - SarifMark-SarifResults-ValidateStructure
            tests:
              - Sarif_Read_NonExistentFile_ThrowsFileNotFoundException
              - Sarif_Read_InvalidSarifFile_ThrowsInvalidOperationException

          - id: SarifMark-Sarif-ToolInfo
            title: The tool shall extract tool information from SARIF files.
            justification: >-
              Extracting tool information enables reports to identify which analysis
              tool generated the results,
              providing context and traceability for findings in the generated documentation.
            tags: [public]
            children:
              - SarifMark-SarifResults-ExtractTool
              - SarifMark-SarifResults-VersionPriority
            tests:
              - Sarif_Read_ValidSarifFile_ProcessesSuccessfully

          - id: SarifMark-Sarif-Results
            title: The tool shall extract results from SARIF files.
            justification: >-
              Result extraction is the core functionality that enables conversion
              of analysis findings into
              readable markdown reports, making issues accessible to developers and
              stakeholders.
            tags: [public]
            children:
              - SarifMark-SarifResults-ParseResults
              - SarifMark-SarifResults-FilterSuppressions
            tests:
              - Sarif_Read_ValidSarifFile_ProcessesSuccessfully

          - id: SarifMark-Sarif-Locations
            title: The tool shall extract location information from SARIF results.
            justification: >-
              Location information allows users to quickly identify where issues exist
              in their codebase,
              improving the actionability of analysis results by pinpointing specific
              files and lines.
            tags: [public]
            children:
              - SarifMark-SarifFinding-Uri
              - SarifMark-SarifFinding-StartLine
            tests:
              - Sarif_GenerateReport_LocationInfo_ContainsLocationInfo

          - id: SarifMark-Sarif-FilePaths
            title: The SARIF subsystem shall require valid file paths for SARIF input.
            justification: >-
              Path validation ensures clear error messages when files are missing
              or incorrectly specified,
              improving user experience and preventing confusing runtime failures.
            tags: [public]
            children:
              - SarifMark-SarifResults-ValidatePathArgument
              - SarifMark-SarifResults-ValidatePathExists
            tests:
              - Sarif_Read_NonExistentFile_ThrowsFileNotFoundException

          - id: SarifMark-Sarif-Processing
            title: The tool shall process valid SARIF files successfully.
            justification: >-
              Successful processing of valid SARIF files is the fundamental capability
              that enables the tool to
              fulfill its primary purpose of converting analysis results to markdown
              documentation.
            tags: [public]
            children:
              - SarifMark-SarifResults-ParseResults
            tests:
              - Sarif_Read_ValidSarifFile_ProcessesSuccessfully

          - id: SarifMark-Sarif-FileCount
            title: The tool shall extract the total number of analyzed files from
              SARIF artifacts.
            justification: >-
              Extracting the file count from SARIF artifacts provides evidence of
              analysis scope, allowing
              users and auditors to verify that the tool analyzed the expected set
              of files.
            tags: [public]
            children:
              - SarifMark-SarifResults-FileCount
            tests:
              - Sarif_GenerateReport_FileCount_ContainsFileCount

          - id: SarifMark-Sarif-MultiRun
            title: The tool shall process SARIF files containing multiple runs and
              return all runs.
            justification: >-
              Multi-run SARIF files are produced when more than one analysis tool
              writes results into a single
              file. Supporting multi-run files ensures the tool works correctly with
              all conformant SARIF
              producers, including CI pipelines that aggregate results from several
              tools.
            tags: [public]
            children:
              - SarifMark-SarifResults-Runs
              - SarifMark-SarifResults-MultiRunMarkdown
            tests:
              - Sarif_Read_MultiRunSarifFile_ProcessesAllRuns
