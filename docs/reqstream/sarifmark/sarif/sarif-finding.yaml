---
# SarifFinding unit requirements

sections:
  - title: 'SarifMark Requirements'
    sections:
      - title: Sarif Requirements
        sections:
          - title: SarifFinding Requirements
            requirements:
              - id: SarifMark-SarifFinding-RuleId
                title: The SarifFinding unit shall preserve the rule identifier provided
                  at creation.
                justification: >-
                  The rule identifier links each finding to the analysis rule that
                  raised
                  it, enabling report consumers to look up rule documentation and
                  understand the category of the issue.
                tags: [internal]
                tests:
                  - SarifFinding_Constructor_AllPropertiesProvided_StoresAllProperties

              - id: SarifMark-SarifFinding-Message
                title: The SarifFinding unit shall preserve the message provided at
                  creation.
                justification: >-
                  The message carries the human-readable description of the finding
                  that appears in the generated report, making the issue understandable
                  without referring back to the raw SARIF file.
                tags: [internal]
                tests:
                  - SarifFinding_Constructor_AllPropertiesProvided_StoresAllProperties

              - id: SarifMark-SarifFinding-Severity
                title: The SarifFinding unit shall preserve the severity level provided
                  at creation.
                justification: >-
                  The severity level classifies findings by impact (error, warning,
                  note, etc.), allowing report consumers to prioritize remediation
                  and apply enforcement rules based on severity thresholds.
                tags: [internal]
                tests:
                  - SarifFinding_Constructor_AllPropertiesProvided_StoresAllProperties

              - id: SarifMark-SarifFinding-Uri
                title: >-
                  The SarifFinding unit shall accept an absent file location to represent
                  findings with no physical location.
                justification: >-
                  Making the file location optional correctly reflects the SARIF specification,
                  where not all results
                  include physical location data, and prevents the record from requiring
                  placeholder values
                  for findings that have no associated file.
                tags: [internal]
                tests:
                  - SarifFinding_Constructor_NullUri_UriPropertyIsNull

              - id: SarifMark-SarifFinding-StartLine
                title: >-
                  The SarifFinding unit shall accept an absent line number to represent
                  findings
                  with no specific line.
                justification: >-
                  An optional line number mirrors the SARIF specification where line
                  information may be absent,
                  and enables the report formatter to present precise location data
                  when available while
                  gracefully omitting it when not.
                tags: [internal]
                tests:
                  - SarifFinding_Constructor_NullStartLine_StartLinePropertyIsNull
