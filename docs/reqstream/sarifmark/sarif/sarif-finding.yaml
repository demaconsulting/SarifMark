---
sections:
  - title: Design Specifications
    sections:
      - title: SarifFinding Record
        requirements:
          - id: SarifMark-SarifFinding-Properties
            title: The SarifFinding record shall store RuleId, Level, Message, Uri, and StartLine properties.
            justification: >-
              Capturing all five properties on a single record provides a self-contained representation of
              one SARIF finding, making it straightforward to pass findings between parsing and formatting
              stages without repeated JSON traversal.
            tags: [internal]
            tests:
              - SarifFinding_InternalConstructor_StoresAllProperties

          - id: SarifMark-SarifFinding-Uri
            title: The SarifFinding record shall store an optional file URI for the finding location.
            justification: >-
              Making the URI optional correctly reflects the SARIF specification, where not all results
              include physical location data, and prevents the record from requiring placeholder values
              for findings that have no associated file.
            tags: [internal]
            tests:
              - SarifFinding_Uri_CanBeNull

          - id: SarifMark-SarifFinding-StartLine
            title: The SarifFinding record shall store an optional start line number for the finding location.
            justification: >-
              An optional start line mirrors the SARIF specification where line information may be absent,
              and enables the report formatter to present precise location data when available while
              gracefully omitting it when not.
            tags: [internal]
            tests:
              - SarifFinding_StartLine_CanBeNull

          - id: SarifMark-SarifFinding-Internal
            title: The SarifFinding record shall only be constructible by internal code.
            justification: >-
              Restricting construction to internal code enforces that SarifFinding instances are always
              produced through the validated parsing pipeline, preventing external consumers from creating
              invalid or inconsistent finding objects.
            tags: [internal]
            tests:
              - SarifFinding_InternalConstructor_StoresAllProperties
