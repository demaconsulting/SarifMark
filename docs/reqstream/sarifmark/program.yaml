---
sections:
  - title: Program Unit Requirements
    requirements:
      - id: SarifMark-Program-Version
        title: The Program unit shall report the tool version derived from the package build metadata.
        justification: >-
          Deriving the version from package build metadata ensures the reported version string
          matches the NuGet package version, providing accurate version information for
          troubleshooting and compatibility verification.
        tags: [internal]
        tests:
          - Program_Main_VersionFlag_DisplaysVersionOnly

      - id: SarifMark-Program-Main
        title: >-
          The Program unit shall parse arguments, execute the requested operation,
          and return the result as an exit code.
        justification: >-
          Keeping argument parsing, command dispatch, and exit code reporting as separate
          responsibilities ensures each can be independently tested and maintained.
        tags: [internal]
        tests:
          - Program_Main_NoArguments_ReturnsError
          - Program_Main_VersionFlag_DisplaysVersionOnly
          - Program_Main_HelpFlag_DisplaysHelp

      - id: SarifMark-Program-Main-Exceptions
        title: The Program unit shall return exit code 1 when argument or processing errors occur.
        justification: >-
          Converting structured error signals into a clean non-zero exit code prevents unhandled
          exceptions from surfacing to the shell while still communicating failure to callers.
        tags: [internal]
        tests:
          - Program_Main_NoArguments_ReturnsError
          - Program_Main_UnknownArgument_ReturnsError

      - id: SarifMark-Program-Run
        title: The Program unit shall process informational requests before attempting SARIF operations.
        justification: >-
          Processing informational requests such as version and help before expensive operations
          gives users predictable and deterministic behavior regardless of argument ordering.
        tags: [internal]
        tests:
          - Program_Main_VersionFlag_DisplaysVersionOnly
          - Program_Main_HelpFlag_DisplaysHelp

      - id: SarifMark-Program-Banner
        title: The Program unit shall emit the tool version and copyright notice on non-silent invocations.
        justification: >-
          Emitting version and copyright on every non-silent invocation gives users immediate context about
          the tool build they are running and satisfies standard open-source attribution requirements.
        tags: [internal]
        tests:
          - Program_Main_HelpFlag_DisplaysHelp

      - id: SarifMark-Program-Help
        title: The Program unit shall emit usage information listing all supported command-line arguments.
        justification: >-
          Comprehensive inline help reduces dependence on external documentation and lets users discover
          available options directly from the command line, improving discoverability in automated and
          interactive environments.
        tags: [internal]
        tests:
          - Program_Main_HelpFlag_DisplaysHelp

      - id: SarifMark-Program-Validation
        title: The Program unit shall execute self-validation when the --validate flag is set.
        justification: >-
          Routing the validate flag to the SelfTest subsystem keeps self-validation logic encapsulated
          and allows it to be tested independently from the primary SARIF analysis workflow.
        tags: [internal]
        tests:
          - Program_Main_ValidateFlag_RunsValidation

      - id: SarifMark-Program-SarifArgument
        title: The Program unit shall require the --sarif argument before beginning SARIF analysis.
        justification: >-
          Validating the SARIF argument before any file I/O prevents confusing downstream errors
          and gives users a clear, actionable error message when the argument is missing.
        tags: [internal]
        tests:
          - Program_Main_NoArguments_ReturnsError

      - id: SarifMark-Program-SarifReading
        title: The Program unit shall read the specified SARIF file and report the tool name, version, and result count.
        justification: >-
          Reporting tool identity and result count after reading confirms successful processing and
          gives users immediate feedback about what was analyzed.
        tags: [internal]
        tests:
          - Program_Main_ValidSarifFile_ProcessesSuccessfully

      - id: SarifMark-Program-EnforcementCheck
        title: The Program unit shall signal failure when enforcement mode is active and issues are found.
        justification: >-
          Translating the presence of SARIF issues into a non-zero exit code enables CI/CD pipelines
          to gate on analysis results without additional scripting.
        tags: [internal]
        tests:
          - Program_Main_EnforceFlagWithIssues_ReturnsError

      - id: SarifMark-Program-ReportGeneration
        title: The Program unit shall write the markdown analysis report to the specified output file.
        justification: >-
          Writing the report to a named output file makes analysis results available for downstream
          documentation steps, archiving, and review workflows.
        tags: [internal]
        tests:
          - Program_Main_ReportFile_CreatesReport
