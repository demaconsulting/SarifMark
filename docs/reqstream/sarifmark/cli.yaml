---
# CLI subsystem requirements
sections:
  - title: 'SarifMark Requirements'
    sections:
      - title: CLI Requirements
        requirements:
          - id: SarifMark-Cli-Interface
            title: >-
              The CLI subsystem shall parse command-line arguments into a
              structured execution context.
            justification: >-
              A command-line interface enables automation, scripting, and integration
              into CI/CD pipelines,
              making the tool suitable for DevOps workflows and batch processing scenarios.
            tags: [public]
            children:
              - SarifMark-Context-Create
            tests:
              - Cli_Create_VersionFlag_SetsVersionFlag
              - Cli_Create_HelpFlag_SetsHelpFlag

          - id: SarifMark-Cli-Output
            title: >-
              The CLI subsystem shall route console output through the execution
              context.
            justification: >-
              Routing all output through the execution context allows the silent
              and log-file settings to uniformly suppress or redirect output
              without requiring each operation to manage its own output destination.
            tags: [public]
            children:
              - SarifMark-Context-WriteLine-Console
              - SarifMark-Context-WriteLine-Log
            tests:
              - Cli_Create_SilentFlag_SuppressesOutput
              - Cli_Create_LogFile_WritesOutputToFile

          - id: SarifMark-Cli-Version
            title: The CLI shall recognize the --version flag.
            justification: >-
              Recognizing the version flag allows the application layer to identify
              the requested operation
              and display the tool version, supporting troubleshooting and compatibility
              verification.
            tags: [public]
            children:
              - SarifMark-Context-VersionFlag
            tests:
              - Cli_Create_VersionFlag_SetsVersionFlag

          - id: SarifMark-Cli-Help
            title: The CLI shall recognize the --help flag.
            justification: >-
              Recognizing the help flag allows the application layer to display usage
              information,
              improving discoverability without consulting external documentation.
            tags: [public]
            children:
              - SarifMark-Context-HelpFlag
            tests:
              - Cli_Create_HelpFlag_SetsHelpFlag

          - id: SarifMark-Cli-Silent
            title: The CLI shall suppress console output when the silent flag is set.
            justification: >-
              Silent mode enables cleaner integration into automated workflows and
              CI/CD pipelines where console
              noise needs to be minimized, while still allowing log files to capture
              detailed information.
            tags: [public]
            children:
              - SarifMark-Context-SilentFlag
            tests:
              - Cli_Create_SilentFlag_SuppressesOutput

          - id: SarifMark-Cli-Log
            title: The CLI shall write output to a log file when the log parameter
              is set.
            justification: >-
              Log file support enables persistent record-keeping, debugging, and audit
              trails, especially valuable
              in automated environments where console output may not be readily available.
            tags: [public]
            children:
              - SarifMark-Context-LogParam
              - SarifMark-Context-LogParam-MissingValue
              - SarifMark-Context-Dispose
            tests:
              - Cli_Create_LogFile_WritesOutputToFile

          - id: SarifMark-Cli-Enforce
            title: The CLI shall recognize the --enforce flag.
            justification: >-
              Recognizing the enforce flag allows the application layer to determine
              whether to apply
              quality gate behavior, making it suitable for integration into CI/CD
              pipelines.
            tags: [public]
            children:
              - SarifMark-Context-EnforceFlag
            tests:
              - Cli_Create_EnforceFlag_SetsEnforceFlag

          - id: SarifMark-Cli-WriteError
            title: The CLI shall write error messages to the standard error stream.
            justification: >-
              Writing errors to stderr separates diagnostic output from
              regular console output, enabling callers and pipelines to
              distinguish between tool output and error information.
            tags: [public]
            children:
              - SarifMark-Context-WriteError-Stderr
              - SarifMark-Context-WriteError-Log
              - SarifMark-Context-WriteError-ExitCode
            tests:
              - Cli_WriteError_WithMessage_SetsExitCodeToOne

          - id: SarifMark-Cli-WriteError-ExitCode
            title: The CLI shall set the process exit code to 1 when an error is written.
            justification: >-
              Automatically updating the exit code when an error is written
              ensures that callers receive a failure signal without requiring
              explicit exit-code management throughout the codebase.
            tags: [public]
            children:
              - SarifMark-Context-WriteError-Stderr
              - SarifMark-Context-WriteError-Log
              - SarifMark-Context-WriteError-ExitCode
              - SarifMark-Context-ExitCode
            tests:
              - Cli_WriteError_WithMessage_SetsExitCodeToOne

          - id: SarifMark-Cli-InvalidArgs
            title: The CLI shall reject unknown command-line arguments.
            justification: >-
              Rejecting unknown arguments prevents silent failures from typos or incorrect
              parameters, ensuring
              users receive immediate feedback about misconfigured commands.
            tags: [public]
            children:
              - SarifMark-Context-UnknownArgs
            tests:
              - Cli_Create_UnknownArgument_ThrowsArgumentException

          - id: SarifMark-Cli-Validate
            title: The CLI shall recognize the --validate flag.
            justification: >-
              Recognizing the validate flag allows the application layer to activate
              self-validation mode,
              enabling verification that the tool operates correctly in the deployment
              environment.
            tags: [public]
            children:
              - SarifMark-Context-ValidateFlag
            tests:
              - Cli_Create_ValidateFlag_SetsValidateFlag

          - id: SarifMark-Cli-Sarif
            title: The CLI shall accept a SARIF file path via the --sarif parameter.
            justification: >-
              Exposing a dedicated SARIF file path parameter gives the application
              layer a clean, named value
              that decouples argument parsing from file processing.
            tags: [public]
            children:
              - SarifMark-Context-SarifParam
              - SarifMark-Context-SarifParam-MissingValue
            tests:
              - Cli_Create_SarifParameter_SetsSarifFilePath

          - id: SarifMark-Cli-Report
            title: The CLI shall accept a report file path via the --report parameter.
            justification: >-
              A dedicated report file path parameter gives the application layer a
              clear output target,
              keeping argument parsing separate from report generation logic.
            tags: [public]
            children:
              - SarifMark-Context-ReportParam
              - SarifMark-Context-ReportParam-MissingValue
            tests:
              - Cli_Create_ReportParameter_SetsReportFilePath

          - id: SarifMark-Cli-ReportDepth
            title: The CLI shall accept a heading depth via the --depth parameter.
            justification: >-
              Exposing a validated heading depth parameter allows the application
              layer to control markdown
              report heading levels without reimplementing argument parsing or range
              checking.
            tags: [public]
            children:
              - SarifMark-Context-ReportDepthParam
              - SarifMark-Context-ReportDepthValidation
              - SarifMark-Context-ReportDepthDefault
            tests:
              - Cli_Create_DepthParameter_SetsDepth
              - Cli_Create_DepthInvalidValue_ThrowsArgumentException

          - id: SarifMark-Cli-Heading
            title: The CLI shall accept a custom heading via the --heading parameter.
            justification: >-
              Exposing a custom heading parameter lets the application layer pass
              user-specified titles
              directly to the report formatter, keeping argument handling separate
              from output logic.
            tags: [public]
            children:
              - SarifMark-Context-HeadingParam
            tests:
              - Cli_Create_HeadingParameter_SetsCustomHeading

          - id: SarifMark-Cli-Results
            title: The CLI shall accept a results file path via the --results parameter.
            justification: >-
              A dedicated results file path parameter gives the application layer
              a clear destination for
              test result output during self-validation, keeping argument parsing
              separate from output logic.
            tags: [public]
            children:
              - SarifMark-Context-ResultsParam
              - SarifMark-Context-ResultsParam-MissingValue
            tests:
              - Cli_Create_ResultsParameter_SetsResultsFilePath

          - id: SarifMark-Cli-ReportDepthLegacyAlias
            title: The CLI shall accept --report-depth as a legacy alias for --depth.
            justification: >-
              Supporting the legacy --report-depth alias preserves backwards compatibility
              for users and scripts
              that relied on the earlier parameter name, avoiding breaking changes
              in automated workflows.
            tags: [public]
            children:
              - SarifMark-Context-ReportDepthParam
              - SarifMark-Context-ReportDepthAlias
            tests:
              - Cli_Create_ReportDepthParameter_SetsReportDepth

          - id: SarifMark-Cli-ResultLegacyAlias
            title: The CLI shall accept --result as a legacy alias for --results.
            justification: >-
              Supporting the legacy --result alias preserves backwards compatibility
              for users and scripts
              that relied on the earlier parameter name, avoiding breaking changes
              in automated workflows.
            tags: [public]
            children:
              - SarifMark-Context-ResultLegacyAlias
            tests:
              - Cli_Create_ResultLegacyAlias_SetsResultsFilePath
