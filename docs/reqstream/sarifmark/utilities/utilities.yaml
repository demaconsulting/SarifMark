---
sections:
  - title: SarifMark Requirements
    sections:
      - title: Utilities Subsystem
        requirements:
          - id: SarifMark-Utilities-SafePathHandling
            title: The Utilities subsystem shall provide safe path-handling functions for use by other subsystems.
            justification: >-
              Centralizing path-safety logic in a dedicated subsystem prevents path-traversal vulnerabilities
              from being independently reimplemented across the codebase and ensures consistent, auditable
              protection wherever external inputs are combined with base paths.
            tags: [internal]
            children:
              - SarifMark-PathHelpers-SafeCombine
              - SarifMark-PathHelpers-NullCheck
              - SarifMark-PathHelpers-PostCombineCheck
            tests:
              - Utilities_SafePathHandling_ValidPaths_CombinesSuccessfully
              - Utilities_SafePathHandling_PathTraversal_ThrowsException
              - Utilities_SafePathHandling_AbsolutePath_ThrowsException
              - Utilities_SafePathHandling_NullInput_ThrowsException
