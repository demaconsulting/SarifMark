---
# Validation unit requirements

sections:
  - title: 'SarifMark Requirements'
    sections:
      - title: SelfTest Requirements
        sections:
          - title: Validation Requirements
            requirements:
              - id: SarifMark-Validation-Run
                title: >-
                  The Validation unit shall execute the validation header, all validation
                  tests,
                  a pass/fail summary, and results file output in sequence.
                justification: >-
                  Sequencing these four phases in a fixed order ensures that every
                  validation run produces a
                  consistent, complete report regardless of individual test outcomes,
                  giving users a reliable
                  picture of the tool's health in their environment.
                tags: [internal]
                tests:
                  - Validation_Run_ValidContext_RunsAllTests

              - id: SarifMark-Validation-NullCheck
                title: The Validation unit shall reject a null execution context with
                  a clear error.
                justification: >-
                  Explicitly rejecting null at the entry boundary produces a clear
                  and immediate diagnostic
                  rather than a cryptic error deep in the call stack, making integration
                  errors easier to
                  diagnose and fix.
                tags: [internal]
                tests:
                  - Validation_Run_NullContext_ThrowsArgumentNullException

              - id: SarifMark-Validation-Header
                title: The Validation unit shall output a system information table
                  before executing tests.
                justification: >-
                  Printing platform and runtime details before any tests execute ensures
                  that validation
                  results can always be contextualized with the environment in which
                  they were collected,
                  aiding reproducibility and cross-environment comparison.
                tags: [internal]
                tests:
                  - Validation_Run_ValidContext_PrintsValidationHeader

              - id: SarifMark-Validation-SarifReadingTest
                title: The Validation unit shall include a SARIF reading test in the
                  validation suite.
                justification: >-
                  Including a SARIF reading test in self-validation confirms that
                  the installed tool can parse
                  real SARIF data in the target environment, catching issues that
                  may not surface in unit tests
                  run during development.
                tags: [internal]
                tests:
                  - Validation_Run_ValidContext_RunsAllTests
                  - Validation_Run_ValidContext_VerifiesSarifReadingOutput

              - id: SarifMark-Validation-ReportGenerationTest
                title: The Validation unit shall include a markdown report generation
                  test in the validation suite.
                justification: >-
                  Validating report generation as a self-contained test confirms that
                  the full pipeline from
                  SARIF input to markdown output operates correctly in the deployment
                  environment, providing
                  confidence beyond what unit tests alone can offer.
                tags: [internal]
                tests:
                  - Validation_Run_ValidContext_RunsAllTests
                  - Validation_Run_ValidContext_VerifiesReportGenerationOutput

              - id: SarifMark-Validation-EnforcementTest
                title: The Validation unit shall include an enforcement mode test
                  in the validation suite.
                justification: >-
                  Testing enforcement mode during self-validation ensures that the
                  quality gate capability
                  functions correctly in the installed environment, confirming that
                  the tool will correctly
                  fail builds when issues are detected.
                tags: [internal]
                tests:
                  - Validation_Run_ValidContext_RunsAllTests
                  - Validation_Run_ValidContext_VerifiesEnforcementOutput

              - id: SarifMark-Validation-Summary
                title: The Validation unit shall output a pass/fail summary after
                  all tests have run.
                justification: >-
                  A printed summary provides an at-a-glance verdict of the overall
                  validation result without
                  requiring the caller to parse individual test lines, making the
                  output useful in both
                  interactive and automated execution contexts.
                tags: [internal]
                tests:
                  - Validation_Run_ValidContext_PrintsSummary

              - id: SarifMark-Validation-TrxResultsFile
                title: The Validation unit shall write TRX format results when the
                  results file has a .trx extension.
                justification: >-
                  Supporting TRX format enables compatibility with Visual Studio and
                  Azure DevOps CI/CD
                  platforms, providing structured test result reporting.
                tags: [internal]
                tests:
                  - Validation_Run_WithTrxResultsFile_WritesResultsFile

              - id: SarifMark-Validation-XmlResultsFile
                title: >-
                  The Validation unit shall write JUnit XML format results when the
                  results file
                  has a .xml extension.
                justification: >-
                  Supporting JUnit XML format enables compatibility with Jenkins,
                  GitHub Actions, and other
                  CI/CD platforms that consume standard JUnit test result files.
                tags: [internal]
                tests:
                  - Validation_Run_WithXmlResultsFile_WritesResultsFile

              - id: SarifMark-Validation-UnsupportedResultsFile
                title: The Validation unit shall report an error for unsupported results
                  file extensions.
                justification: >-
                  Reporting an error for unrecognized extensions prevents silent data
                  loss when callers specify
                  an unsupported output format, making configuration mistakes immediately
                  visible.
                tags: [internal]
                tests:
                  - Validation_Run_WithUnsupportedResultsFileExtension_WritesError

              - id: SarifMark-Validation-WriteResultsFile-IOFailure
                title: >-
                  The Validation unit shall report an error and continue when writing
                  the results
                  file fails due to an I/O or access exception.
                justification: >-
                  Catching write failures and routing them through context.WriteError
                  prevents an unhandled
                  exception from obscuring the validation results that were already
                  printed, ensuring the
                  caller always receives a usable exit code and diagnostic message.
                tags: [internal]
                tests:
                  - Validation_Run_WithNonExistentResultsDirectory_WritesError

              - id: SarifMark-Validation-TempDir
                title: >-
                  The Validation unit shall create isolated temporary directories
                  for test
                  execution and clean them up on completion.
                justification: >-
                  Creating and cleaning up temporary directories ensures that test
                  isolation is maintained
                  and that test artifacts do not accumulate on disk across repeated
                  validation runs.
                tags: [internal]
                tests:
                  - Validation_TemporaryDirectory_Create_DirectoryExists
                  - Validation_TemporaryDirectory_Dispose_DirectoryDeleted
