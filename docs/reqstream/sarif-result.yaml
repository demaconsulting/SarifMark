---
sections:
  - title: Internal Functionality
    sections:
      - title: SarifResult Record
        requirements:
          - id: SarifMark-SR-Properties
            title: The SarifResult record shall store RuleId, Level, Message, Uri, and StartLine properties.
            justification: >-
              Capturing all five properties on a single record provides a self-contained representation of
              one SARIF result, making it straightforward to pass findings between parsing and formatting
              stages without repeated JSON traversal.
            tags: [internal]
            tests:
              - SarifResults_InternalConstructor_CreatesValidInstance

          - id: SarifMark-SR-Uri
            title: The SarifResult record shall store an optional file URI for the result location.
            justification: >-
              Making the URI optional correctly reflects the SARIF specification, where not all results
              include physical location data, and prevents the record from requiring placeholder values
              for results that have no associated file.
            tags: [internal]
            tests:
              - SarifResults_Read_WithLocations_ReturnsResultsWithLocationData

          - id: SarifMark-SR-StartLine
            title: The SarifResult record shall store an optional start line number for the result location.
            justification: >-
              An optional start line mirrors the SARIF specification where line information may be absent,
              and enables the report formatter to present precise location data when available while
              gracefully omitting it when not.
            tags: [internal]
            tests:
              - SarifResults_Read_WithLocations_ReturnsResultsWithLocationData

          - id: SarifMark-SR-Internal
            title: The SarifResult record shall only be constructible by internal code.
            justification: >-
              Restricting construction to internal code enforces that SarifResult instances are always
              produced through the validated parsing pipeline, preventing external consumers from creating
              invalid or inconsistent result objects.
            tags: [internal]
            tests:
              - SarifResults_InternalConstructor_CreatesValidInstance
