---
# ReqStream OTS requirements

sections:
  - title: OTS Software Requirements
    sections:
      - title: ReqStream Requirements
        requirements:
          - id: SarifMark-OTS-ReqStream-Processing
            title: ReqStream shall process all included requirements files and build
              a complete requirements model.
            justification: |
              ReqStream reads requirements.yaml and all included YAML files to build
              the complete requirements model used for enforcement and report generation.
              The self-validation test ReqStream_RequirementsProcessing confirms this
              core parsing feature works correctly in the installed environment.
            tags: [ots]
            tests:
              - ReqStream_RequirementsProcessing

          - id: SarifMark-OTS-ReqStream-TraceMatrix
            title: ReqStream shall generate a traceability matrix linking requirements
              to tests.
            justification: |
              ReqStream generates a traceability matrix document that links every
              requirement to its linked test evidence. The self-validation test
              ReqStream_TraceMatrix confirms the matrix generation feature works correctly.
            tags: [ots]
            tests:
              - ReqStream_TraceMatrix

          - id: SarifMark-OTS-ReqStream-ReportExport
            title: ReqStream shall export requirements reports and justification documents.
            justification: |
              ReqStream generates a requirements report and a justifications document
              as release artifacts. The self-validation test ReqStream_ReportExport
              confirms report and justification export works correctly.
            tags: [ots]
            tests:
              - ReqStream_ReportExport

          - id: SarifMark-OTS-ReqStream-TagsFiltering
            title: ReqStream shall filter requirements by tag when tags are specified.
            justification: |
              Tag filtering allows subsets of requirements to be processed or enforced
              selectively. The self-validation test ReqStream_TagsFiltering confirms
              tag-based filtering works correctly.
            tags: [ots]
            tests:
              - ReqStream_TagsFiltering

          - id: SarifMark-OTS-ReqStream-Enforcement
            title: ReqStream shall enforce that every requirement is linked to passing
              test evidence.
            justification: |
              When run with --enforce, ReqStream exits with a non-zero code if any
              requirement lacks test evidence, making unproven requirements a
              build-breaking condition. A successful self-validation run with
              ReqStream_EnforcementMode proves enforcement is functioning correctly.
            tags: [ots]
            tests:
              - ReqStream_EnforcementMode

          - id: SarifMark-OTS-ReqStream-Lint
            title: ReqStream shall validate requirements files and report structural
              issues.
            justification: |
              The --lint mode validates requirements YAML files for structural and
              semantic issues without processing test results. The self-validation
              test ReqStream_Lint confirms lint mode works correctly.
            tags: [ots]
            tests:
              - ReqStream_Lint
